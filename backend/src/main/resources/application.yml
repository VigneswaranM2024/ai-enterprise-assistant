# =============================================================================
# AI ENTERPRISE ASSISTANT — MASTER APPLICATION CONFIGURATION
# Spring Boot 3.3+ / Java 21 LTS
# =============================================================================

spring:
  application:
    name: ai-enterprise-assistant

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Multi-part File Upload Constraints
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # Flyway Migration Configuration
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: false

  # Jackson JSON Serializer Configuration
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: true
    default-property-inclusion: non_null
    time-zone: UTC

# Server Configuration
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

# OpenAPI / Swagger UI Settings
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

# Security & JWT Configuration
security:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:900000} # 15 Minutes
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 Days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:80,http://localhost}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,X-Tenant-ID,X-Requested-With
    allow-credentials: true
    max-age: 3600

# Groq LLM Configuration
groq:
  api-key: ${GROQ_API_KEY:}
  base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
  model: ${GROQ_MODEL:openai/gpt-oss-20b}
  temperature: ${GROQ_TEMPERATURE:0.2}
  max-tokens: ${GROQ_MAX_TOKENS:2048}

# Gemini Embedding Configuration
embedding:
  provider: ${EMBEDDING_PROVIDER:gemini}
  api-key: ${GEMINI_API_KEY:}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
  model: ${GEMINI_EMBEDDING_MODEL:models/gemini-embedding-2}
  dimension: ${GEMINI_EMBEDDING_DIMENSION:768}
  batch-size: ${EMBEDDING_BATCH_SIZE:50}

# RAG Generation & Citation Configuration
rag:
  retrieval:
    top-k: ${RAG_TOP_K:8}
    max-top-k: ${RAG_MAX_TOP_K:10}
    similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.55}
    max-context-tokens: ${RAG_MAX_CONTEXT_TOKENS:6000}
  generation:
    temperature: ${RAG_TEMPERATURE:0.2}
    max-tokens: ${RAG_MAX_TOKENS:2048}

# Chat Memory & Session Configuration
chat:
  memory:
    max-messages: ${CHAT_MAX_MESSAGES:10}
    max-context-tokens: ${CHAT_MAX_CONTEXT_TOKENS:4000}

# Redis Caching Configuration
cache:
  redis:
    enabled: ${CACHE_REDIS_ENABLED:true}
    default-ttl: ${CACHE_DEFAULT_TTL:10m}
    document-metadata-ttl: ${CACHE_DOCUMENT_TTL:10m}
    permission-ttl: ${CACHE_PERMISSION_TTL:5m}
    session-ttl: ${CACHE_SESSION_TTL:15m}
    dashboard-ttl: ${CACHE_DASHBOARD_TTL:2m}
    platform-dashboard-ttl: ${CACHE_PLATFORM_DASHBOARD_TTL:2m}

# API Rate Limiting Configuration
rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  requests-per-minute: ${RATE_LIMIT_RPM:30}

# Spring Boot Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  health:
    defaults:
      enabled: true

